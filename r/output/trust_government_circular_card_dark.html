  // method can be called like a regular function, it has the target permanently
  // bound to it so "this" will work correctly.

  //   method1: function() { console.log('a1'); }
  //   method2: function() { console.log('a2'); }

  //   method1: function() { console.log('b1'); }
  // };

  // delegateMethod(a, b, "method2");

    var inherited = delegator[methodName];

      var target = delegatee;
      var method = delegatee[methodName];

      // call the method on the delegator, if it exists.

    }

    }
    if (value.length === 3) {
      return {top: value[0], right: value[1], bottom: value[2], left: value[1]};

  //   Each element must be a valid JavaScript expression that yields a
  //   function. Or, can be an array of objects with "code" and "data"
  //   properties; in this case, the "code" property should be a string
  //   of JS that's an expr that yields a function, and "data" should be
  //   an object that will be added as an additional argument when that
  //   function is called.

  //   execution.
  // @param args Array of arguments to be passed to the functions. (The
  //   same arguments will be passed to all functions.)

      forEach(tasks, function(task) {
        var theseArgs = args;
        if (typeof(task) === "object") {
          theseArgs = theseArgs.concat([task.data]);
          task = task.code;
        }
        var taskFunc = tryEval(task);
        if (typeof(taskFunc) !== "function") {
          throw new Error("Task must be a function! Source:\n" + task);
        }
        taskFunc.apply(target, theseArgs);

  // Note that enclosing coerces a function declaration into
  // an expression that eval() can parse
  // (otherwise, a SyntaxError is thrown)
  function tryEval(code) {
    var result = null;
    try {
      result = eval("(" + code + ")");
    } catch(error) {
      if (!(error instanceof SyntaxError)) {
        throw error;
      }
      try {
        result = eval(code);
      } catch(e) {
        if (e instanceof SyntaxError) {
          throw error;
        } else {
          throw e;
        }
      }
    }
    return result;
  }

    var sizing = sizingPolicy(el);
    if (!sizing)
      return;

    var cel = document.getElementById("htmlwidget_container");
    if (!cel)
      return;

    if (typeof(sizing.padding) !== "undefined") {
      document.body.style.margin = "0";
      document.body.style.padding = paddingToCss(unpackPadding(sizing.padding));
    }

    if (sizing.fill) {
      document.body.style.overflow = "hidden";
      document.body.style.width = "100%";
      document.body.style.height = "100%";
      document.documentElement.style.width = "100%";
      document.documentElement.style.height = "100%";

      var pad = unpackPadding(sizing.padding);
      cel.style.top = pad.top + "px";
      cel.style.right = pad.right + "px";
      cel.style.bottom = pad.bottom + "px";
      cel.style.left = pad.left + "px";
      el.style.width = "100%";
      el.style.height = "100%";

      return {
        getWidth: function() { return cel.getBoundingClientRect().width; },
        getHeight: function() { return cel.getBoundingClientRect().height; }
      };

      el.style.height = px(sizing.height);

          errorSpan.text(err.message);

          evalAndRun(data.jsHooks.render, initResult, [el, data.x]);

  }

  / delay execution of those methods (until Shiny methods are ready)
  / https://github.com/rstudio/leaflet/blob/18ec981/javascript/src/index.js#L266-L268

<style type="text/css">.girafe {
margin-left: auto;
margin-right: auto;
}
.girafe_container_std {
margin-left: auto;
margin-right: auto;
position: relative;
text-align: center;
}
.girafe_container_ie {
height: 0;
}
.girafe_svg_ie {
position: absolute;
top: 0;
left: 0;
}
.ggiraph-toolbar {
background-color: rgb(255, 255, 255);
background-color: rgba(255, 255, 255, 0.3);
border-radius: 5px;
padding: 2px;
}
.ggiraph-toolbar-floating {
position: absolute;
opacity: 0;
}
.ggiraph-toolbar-top,
.ggiraph-toolbar-bottom {
text-align: center;
}
.ggiraph-toolbar-topleft,
.ggiraph-toolbar-bottomleft {
text-align: left;
}
.ggiraph-toolbar-topright,
.ggiraph-toolbar-bottomright {
text-align: right;
}
.ggiraph-toolbar-floating-top {
top: 3px;
right: 0;
left: 0;
}
.ggiraph-toolbar-floating-topleft {
top: 3px;
left: 3px;
}
.ggiraph-toolbar-floating-topright {
top: 3px;
right: 3px;
}
.ggiraph-toolbar-floating-bottom {
bottom: 3px;
right: 0;
left: 0;
}
.ggiraph-toolbar-floating-bottomleft {
left: 3px;
bottom: 3px;
}
.ggiraph-toolbar-floating-bottomright {
right: 3px;
bottom: 3px;
}
.ggiraph-toolbar-block {
display: inline-block;
}
.ggiraph-toolbar-block:not(:last-child) {
margin-right: 10px;
}
.ggiraph-toolbar-icon {
display: inline-block;
cursor: pointer;
border: 0;
padding: 0;
margin: 0;
width: 15pt;
height: 15pt;
}
.ggiraph-toolbar-icon:not(:last-child) {
margin-right: 3px;
}
.ggiraph-toolbar-icon svg {
pointer-events: none;
}
.ggiraph-toolbar-icon.drop {
stroke: #e30c37;
fill: #e30c37;
}
.ggiraph-toolbar-icon.drop:hover {
stroke: #333;
fill: #333;
}
.ggiraph-toolbar-icon.neutral {
stroke: #069;
fill: #069;
}
.ggiraph-toolbar-icon.neutral:hover {
stroke: #333;
fill: #333;
}
.ggiraph-svg .lasso path {
stroke: rgb(80, 80, 80);
stroke-width: 1px;
}
.ggiraph-svg .lasso .drawn {
fill-opacity: 0.05;
}
.ggiraph-svg .lasso .loop_close {
fill: none;
stroke-dasharray: 4, 4;
}
.ggiraph-svg .lasso .origin {
fill: #333;
fill-opacity: 0.5;
}
.ggiraph-svg .dragrect rect {
stroke: rgb(80, 80, 80);
stroke-width: 1px;
fill-opacity: 0.05;
}

.ggiraph-svg .ggiraph-svg-rootg circle:not([id]),
.ggiraph-svg .ggiraph-svg-rootg image:not([id]),
.ggiraph-svg .ggiraph-svg-rootg line:not([id]),
.ggiraph-svg .ggiraph-svg-rootg path:not([id]),
.ggiraph-svg .ggiraph-svg-rootg polygon:not([id]),
.ggiraph-svg .ggiraph-svg-rootg polyline:not([id]),
.ggiraph-svg .ggiraph-svg-rootg rect:not([id]):not(.ggiraph-svg-bg),
.ggiraph-svg .ggiraph-svg-rootg text:not([id]) {
pointer-events: none;
}

.ggiraph-svg .ggiraph-svg-rootg [id] {
pointer-events: all;
}

.ggiraph-fullscreen-modal {
position: fixed;
inset: 0;
background-color: rgba(0, 0, 0, 0.85);
display: flex;
align-items: center;
justify-content: center;
}
.ggiraph-fullscreen-content {
position: relative;
height: 90vw;
max-height: 90vh;
background-color: white;
border-radius: 8px;
padding: 20px;
display: flex;
align-items: center;
justify-content: center;
}
.ggiraph-fullscreen-close {
position: absolute;
top: 10px;
right: 10px;
width: 32px;
height: 32px;
border: none;
background: #f0f0f0;
border-radius: 50%;
cursor: pointer;
font-size: 20px;
line-height: 1;
display: flex;
align-items: center;
justify-content: center;
}
.ggiraph-fullscreen-close:hover {
background-color: #e30c37;
color: white;
}
